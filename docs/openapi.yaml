openapi: "3.1.0"
info:
  title: jwtoken-tester API
  description: |
    Ephemeral JWT/JWKS test issuer for integration testing JWT-aware services.
    This is a **test tool only** - not a production IdP. Keys are generated in-memory
    and discarded on shutdown. No TLS is implemented; terminate TLS at a reverse proxy.
  version: "2.5.0"
  contact:
    name: jwtoken-tester
    url: https://github.com/larryf1/jwtoken-tester
    email: larryf1@gmail.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://127.0.0.1:8080
    description: Default local development server

tags:
  - name: Metadata
    description: Service metadata and health
  - name: Keys
    description: JWKS and key management endpoints
  - name: Tokens
    description: Token minting endpoints
  - name: Introspection
    description: RFC 7662 token introspection
  - name: Verification
    description: Self-check token verification
  - name: Discovery
    description: OpenID Connect and OAuth authorization server metadata

paths:
  /:
    get:
      tags: [Metadata]
      summary: Service index
      description: Returns basic service information and available endpoints
      operationId: getIndex
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexResponse'

  /healthz:
    get:
      tags: [Metadata]
      summary: Health check
      description: Liveness probe with active key IDs per algorithm
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /version:
    get:
      tags: [Metadata]
      summary: Version information
      description: Returns the service version
      operationId: getVersion
      responses:
        "200":
          description: Version information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'

  /.well-known/jwks.json:
    get:
      tags: [Keys]
      summary: JSON Web Key Set (JWKS)
      description: |
        Returns the live public key set including active keys and retired keys
        still within their grace period. Each key includes RFC 7638 thumbprint-derived
        `kid`, `use=sig`, and algorithm (`RS256`, `ES256`, or `EdDSA`).
      operationId: getJWKS
      responses:
        "200":
          description: JWKS document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKS'
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /.well-known/jwks.json/{kid}:
    get:
      tags: [Keys]
      summary: Get single JWK by Key ID
      description: |
        Fetches a single public key from the live key set by its thumbprint-derived `kid`.
        Returns the same shape as one entry of the JWKS set. Retired keys still inside
        their grace window are reachable.
      operationId: getJWKByKID
      parameters:
        - name: kid
          in: path
          required: true
          schema:
            type: string
          description: RFC 7638 thumbprint-derived Key ID
      responses:
        "200":
          description: JWK document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWK'
        "400":
          description: Missing kid parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /.well-known/openid-configuration:
    get:
      tags: [Discovery]
      summary: OpenID Connect Discovery Document
      description: |
        Shared metadata document advertising `issuer`, derived `jwks_uri`,
        `token_endpoint` (`<issuer>/oauth/token`), `introspection_endpoint`,
        `grant_types_supported`, `token_endpoint_auth_methods_supported`,
        `scopes_supported` when configured, and `id_token_signing_alg_values_supported`
        listing all enabled algorithms.

        The document deliberately omits `authorization_endpoint`,
        `code_challenge_methods_supported`, and `userinfo_endpoint`.
      operationId: getDiscovery
      responses:
        "200":
          description: Discovery document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryResponse'

  /.well-known/oauth-authorization-server:
    get:
      tags: [Discovery]
      summary: OAuth 2.0 Authorization Server Metadata (RFC 8414)
      description: |
        Serves the same metadata document as `/.well-known/openid-configuration`.
        Derived core fields (`issuer`, `jwks_uri`, `token_endpoint`,
        `introspection_endpoint`) cannot be overridden by `DISCOVERY_EXTRA_JSON`.
      operationId: getAuthorizationServerMetadata
      responses:
        "200":
          description: Authorization server metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryResponse'

  /token:
    post:
      tags: [Tokens]
      summary: Mint a JWT
      description: |
        Mints a signed JWT with the requested claims and algorithm.
        Empty body mints an anonymous token with defaults.

        **Claim handling:**
        - `iss`, `iat`, `nbf` are injected automatically; explicit values in `claims` win
        - `exp`, `iat`, `nbf` accept epoch seconds (`1800000000`), durations (`"90m"`, `"in 1h"`), or RFC 3339 timestamps
        - Omitted `exp` means now + `DEFAULT_TTL` (default 1h)
        - Lifetimes beyond `MAX_TTL` (default 24h) are refused with 400
        - Already-expired tokens are minted happily (useful for negative tests)

        **Algorithms:** `RS256`, `ES256`, `EdDSA` (must be enabled)
      operationId: mintToken
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        "200":
          description: Token minted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          headers:
            X-Request-ID:
              schema:
                type: string
              description: Request correlation ID
        "400":
          description: Bad request (invalid JSON, unsupported algorithm, TTL too long)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: No active signing key available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /oauth/token:
    post:
      tags: [Tokens]
      summary: Mint a token with OAuth 2.0 client credentials
      description: |
        RFC 6749 client-credentials token endpoint for generic OAuth clients.
        The request body must be `application/x-www-form-urlencoded`.

        **Authentication** is permissive: a client identifier is required, but
        `client_secret` is never validated. The identifier may be supplied with
        HTTP Basic, in the form body, or alone as `client_id`.

        **Claims:** `iss`, `sub` and `client_id` from the client identifier,
        `iat`, `nbf`, `exp`, `jti`, a space-normalized `scope` when requested,
        and `aud` only when `AUDIENCE` is configured. The legacy
        `capabilities`, `idtyp`, `allowedResources`, and `version` claims are
        absent.

        `SCOPES` only advertises scopes in discovery; it does not restrict what
        a client may request.
      operationId: mintOAuthClientCredentialsToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
      responses:
        "200":
          description: Token minted successfully
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
              description: Token responses are never cacheable
            Pragma:
              schema:
                type: string
                enum: [no-cache]
              description: HTTP/1.0 cache compatibility
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        "400":
          description: Invalid request, unsupported grant type, disabled algorithm, invalid TTL, or oversized body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Internal token-minting failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
        "503":
          description: No active signing key available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'

  /introspect:
    post:
      tags: [Introspection]
      summary: Introspect a token (RFC 7662)
      description: |
        Verifies the supplied token against this server's live keyring and
        configured issuer. The request body must be
        `application/x-www-form-urlencoded`; `token_type_hint` is accepted and
        ignored.

        Authentication is permissive and no client identifier is required.
        Active tokens echo every token claim plus authoritative `active: true`
        and `token_type: "Bearer"`. Expired, not-yet-valid, wrong-issuer,
        unknown-key, bad-signature, and malformed tokens return `200` with
        exactly `{"active": false}` and no claim fields.
      operationId: introspectToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IntrospectionRequest'
      responses:
        "200":
          description: Introspection result; inspect `active`
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
              description: Introspection responses are never cacheable
            Pragma:
              schema:
                type: string
                enum: [no-cache]
              description: HTTP/1.0 cache compatibility
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrospectionResponse'
        "400":
          description: Invalid request (missing token, non-form body, oversized body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Verification failed unexpectedly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'

  /verify:
    post:
      tags: [Verification]
      summary: Verify a token against this issuer's live keyring
      description: |
        Self-check verification: the token is checked only against the running
        issuer's live keyring. The endpoint accepts no caller-supplied key
        material or key locations (`jwks`, `jwks_url`, `issuer`) and performs no
        outbound network request. Unknown request fields are rejected with `400`.

        The issuer claim is always validated against this server's configured
        issuer. The accepted algorithms default to the enabled signing
        algorithms and can be narrowed with `alg`. A request may supply `aud`
        and `leeway` to simulate consumer expectations.

        Failure reasons are a closed, ordered set: `malformed`, `alg`, `kid`,
        `signature`, `expired`, `not_yet_valid`, `issuer`, `audience`.
        Claims appear under `claims` only after signature verification, under
        `unverified_claims` before it, and under neither for malformed input.
      operationId: verifyToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        "200":
          description: Verification completed; inspect `valid` and `reason`
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
              description: Verification responses are never cacheable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        "400":
          description: Invalid request (missing token, unknown field, bad alg or leeway, oversized body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Verification failed for a reason outside the closed reason set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v2/oauth/token:
    post:
      tags: [Tokens]
      summary: Mint a legacy v2 OAuth-style JWT
      description: |
        Legacy bespoke endpoint retained for compatibility. Discovery advertises
        `/oauth/token` instead; use this route only when the v2 claim profile is
        required.

        Mints a signed v2 token using `X-Client-Id` and the comma-separated `Scope` query
        parameter. Requested scopes are copied into the token's `capabilities` claim.
        The JWT also includes `sub`, `aud`, `idtyp`, `allowedResources`, `version`,
        `client_id`, and the standard `iss`, `iat`, `nbf`, `exp`, and `jti` claims.
        This test issuer does not validate `X-Client-Secret`; `allowedPartners` is the
        fixed example value `partner`.

        Optional `alg` and `ttl` query parameters select the signing algorithm and
        lifetime. When omitted, `alg` falls back to RS256 when enabled, then to the
        first enabled algorithm.
      operationId: mintOAuthV2Token
      parameters:
        - name: Scope
          in: query
          required: true
          description: Comma-separated capabilities to place in the token.
          schema:
            type: string
          example: capability1,capability2
        - name: alg
          in: query
          required: false
          description: Enabled signing algorithm; defaults to RS256 when enabled, else the first enabled algorithm.
          schema:
            type: string
            enum: [RS256, ES256, EdDSA]
          example: ES256
        - name: ttl
          in: query
          required: false
          description: Non-negative Go duration capped by `MAX_TTL`.
          schema:
            type: string
          example: 5m
        - name: X-Client-Id
          in: header
          required: true
          schema:
            type: string
          example: client-id
        - name: X-Client-Secret
          in: header
          required: false
          description: Accepted for request compatibility but not validated by this test issuer.
          schema:
            type: string
      responses:
        "200":
          description: Token minted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        "400":
          description: Missing client ID or scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: No active signing key available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    IndexResponse:
      type: object
      properties:
        service:
          type: string
          example: jwtoken-tester
        version:
          type: string
          example: "1.0.0"
        warning:
          type: string
          example: "integration-test token issuer; ephemeral in-memory keys"
        endpoints:
          type: array
          items:
            type: string
          example:
            - "GET /healthz"
            - "GET /version"
            - "GET /.well-known/jwks.json"
            - "GET /.well-known/jwks.json/{kid}"
            - "GET /.well-known/openid-configuration"
            - "GET /.well-known/oauth-authorization-server"
            - "POST /token"
            - "POST /oauth/token"
            - "POST /introspect"
            - "POST /v2/oauth/token"
            - "POST /verify"

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
          example: ok
        version:
          type: string
          example: "1.0.0"
        warning:
          type: string
          example: "test issuer: keys are ephemeral and in-memory; do not use in production"
        algorithms:
          type: array
          items:
            type: string
            enum: [RS256, ES256, EdDSA]
          example: [RS256, ES256, EdDSA]
        active_kids:
          type: object
          additionalProperties:
            type: string
          example:
            RS256: "abc123..."
            ES256: "def456..."

    VersionResponse:
      type: object
      properties:
        version:
          type: string
          example: "1.0.0"

    JWKS:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JWK'

    JWK:
      type: object
      properties:
        kty:
          type: string
          enum: [RSA, EC, OKP]
          description: Key type
        use:
          type: string
          enum: [sig]
          description: Key usage (signature)
        alg:
          type: string
          enum: [RS256, ES256, EdDSA]
          description: Algorithm
        kid:
          type: string
          description: RFC 7638 thumbprint-derived Key ID
        n:
          type: string
          description: RSA modulus (for RSA keys)
        e:
          type: string
          description: RSA public exponent (for RSA keys)
        crv:
          type: string
          enum: [P-256, Ed25519]
          description: Curve (for EC/OKP keys)
        x:
          type: string
          description: X coordinate (for EC/OKP keys)
        y:
          type: string
          description: Y coordinate (for EC keys)

    DiscoveryResponse:
      type: object
      additionalProperties: true
      description: |
        Shared metadata document. Additional members may be merged with
        `DISCOVERY_EXTRA_JSON`; the derived core fields cannot be overridden.
      properties:
        issuer:
          type: string
          format: uri
          example: "http://127.0.0.1:8080"
        jwks_uri:
          type: string
          format: uri
          example: "http://127.0.0.1:8080/.well-known/jwks.json"
        token_endpoint:
          type: string
          format: uri
          description: Always `<issuer>/oauth/token`.
          example: "http://127.0.0.1:8080/oauth/token"
        introspection_endpoint:
          type: string
          format: uri
          description: Always `<issuer>/introspect`.
          example: "http://127.0.0.1:8080/introspect"
        subject_types_supported:
          type: array
          items:
            type: string
          example: ["public"]
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
            enum: [RS256, ES256, EdDSA]
          example: ["RS256", "ES256", "EdDSA"]
        grant_types_supported:
          type: array
          items:
            type: string
          example: ["client_credentials"]
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
            enum: [client_secret_basic, client_secret_post, none]
          example: ["client_secret_basic", "client_secret_post", "none"]
        response_types_supported:
          type: array
          items:
            type: string
          example: ["token"]
        claims_supported:
          type: array
          items:
            type: string
          example: ["iss", "sub", "aud", "exp", "nbf", "iat", "jti", "scope", "client_id"]
        scopes_supported:
          type: array
          description: Present only when `SCOPES` is configured.
          items:
            type: string
          example: ["read", "write"]

    TokenRequest:
      type: object
      properties:
        claims:
          type: object
          description: Arbitrary claim set; standard claims included
          additionalProperties: true
          example:
            sub: "user-123"
            aud: ["my-service"]
            roles: ["admin"]
            tenant: "acme"
        alg:
          type: string
          enum: [RS256, ES256, EdDSA]
          description: Signing algorithm (must be enabled)
          example: RS256
        headers:
          type: object
          description: Extra protected JOSE header parameters to embed
          additionalProperties: true
          example:
            x-test-harness: "run-7"

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT in JWS Compact Serialization
          example: "eyJhbGciOiJSUzI1NiIsImtpZCI6Ii4uLiJ9..."
        token_type:
          type: string
          enum: [Bearer]
          example: Bearer
        expires_in:
          type: integer
          description: Token lifetime in seconds
          example: 3600

    OAuthTokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
          description: Only `client_credentials` is supported.
          example: client_credentials
        client_id:
          type: string
          description: |
            Client identifier used for `sub` and `client_id`. Required unless
            supplied with HTTP Basic authentication.
          example: test-client
        client_secret:
          type: string
          description: Accepted for compatibility but never validated by this test issuer.
          example: ignored
        scope:
          type: string
          description: Space-delimited scopes; whitespace is normalized and echoed back.
          example: read write
        alg:
          type: string
          enum: [RS256, ES256, EdDSA]
          description: Enabled signing algorithm; defaults to RS256 when enabled, else the first enabled algorithm.
          example: ES256
        ttl:
          type: string
          description: Non-negative Go duration capped by `MAX_TTL`.
          example: 5m

    OAuthTokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: JWT in JWS Compact Serialization
          example: "eyJhbGciOiJSUzI1NiIsImtpZCI6Ii4uLiJ9..."
        token_type:
          type: string
          enum: [Bearer]
          example: Bearer
        expires_in:
          type: integer
          description: Token lifetime in seconds
          example: 3600
        scope:
          type: string
          description: Normalized scope, present only when requested.
          example: read write

    OAuthErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Standard OAuth error code.
          example: invalid_request
        error_description:
          type: string
          description: Human-readable error message.
          example: grant_type is required

    IntrospectionRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: JWT in JWS Compact Serialization
          example: "eyJhbGciOiJSUzI1NiIsImtpZCI6Ii4uLiJ9..."
        token_type_hint:
          type: string
          description: Accepted and ignored.
          example: access_token

    IntrospectionResponse:
      type: object
      required: [active]
      additionalProperties: true
      description: |
        For an active token, every token claim is echoed alongside authoritative
        `active` and `token_type`. For an inactive token, only `active: false`
        is returned.
      properties:
        active:
          type: boolean
          example: true
        token_type:
          type: string
          description: Present only for active tokens.
          enum: [Bearer]
          example: Bearer
        scope:
          type: string
          description: Present only when the token carries a `scope` claim.
          example: read write

    VerifyRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          description: JWT in JWS Compact Serialization
          example: "eyJhbGciOiJSUzI1NiIsImtpZCI6Ii4uLiJ9..."
        aud:
          description: Expected audience; a match against any member passes.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: my-service
        alg:
          type: array
          minItems: 1
          description: Non-empty subset of enabled algorithms to accept.
          items:
            type: string
            enum: [RS256, ES256, EdDSA]
          example: [RS256]
        leeway:
          type: string
          description: Go duration widening the exp/nbf/iat window.
          example: 30s

    VerifyResponse:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        reason:
          type: string
          description: Closed failure reason; absent when valid.
          enum: [malformed, alg, kid, signature, expired, not_yet_valid, issuer, audience]
        error:
          type: string
          description: Human-readable failure message; absent when valid.
        header:
          type: object
          additionalProperties: true
          description: Decoded JOSE header
        claims:
          type: object
          additionalProperties: true
          description: Token claims, present only after signature verification succeeded.
        unverified_claims:
          type: object
          additionalProperties: true
          description: Token claims parsed before signature verification; never present with `claims`.
        kid:
          type: string
          description: Key ID from the token header, when readable.
        kid_status:
          type: string
          enum: [active, retired, unknown]
          description: Whether the token's key is active, retired inside its grace window, or absent.
        alg:
          type: string
          description: Algorithm from the token header, when readable.

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "unsupported algorithm"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    X-Request-ID:
      schema:
        type: string
      description: Request correlation ID (generated if not provided)
    X-Content-Type-Options:
      schema:
        type: string
        enum: [nosniff]
      description: Prevents MIME type sniffing
    X-Frame-Options:
      schema:
        type: string
        enum: [DENY]
      description: Prevents clickjacking
    Referrer-Policy:
      schema:
        type: string
        enum: [no-referrer]
      description: Controls referrer information
    Content-Security-Policy:
      schema:
        type: string
      description: Restricts resource loading