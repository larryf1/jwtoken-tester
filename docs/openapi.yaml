components:
  schemas:
    internal_server.DiscoveryResponse:
      properties:
        claims_supported:
          example:
          - iss
          - sub
          - aud
          - exp
          - nbf
          - iat
          - jti
          - scope
          - client_id
          items:
            type: string
          type: array
          uniqueItems: false
        grant_types_supported:
          example:
          - client_credentials
          items:
            type: string
          type: array
          uniqueItems: false
        id_token_signing_alg_values_supported:
          example:
          - RS256
          - ES256
          - EdDSA
          items:
            type: string
          type: array
          uniqueItems: false
        introspection_endpoint:
          example: http://127.0.0.1:8080/introspect
          format: uri
          type: string
        issuer:
          example: http://127.0.0.1:8080
          format: uri
          type: string
        jwks_uri:
          example: http://127.0.0.1:8080/.well-known/jwks.json
          format: uri
          type: string
        response_types_supported:
          example:
          - token
          items:
            type: string
          type: array
          uniqueItems: false
        scopes_supported:
          example:
          - read
          - write
          items:
            type: string
          type: array
          uniqueItems: false
        subject_types_supported:
          example:
          - public
          items:
            type: string
          type: array
          uniqueItems: false
        token_endpoint:
          example: http://127.0.0.1:8080/oauth/token
          format: uri
          type: string
        token_endpoint_auth_methods_supported:
          example:
          - client_secret_basic
          - client_secret_post
          - none
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    internal_server.ErrorResponse:
      properties:
        error:
          example: unsupported algorithm
          type: string
      type: object
    internal_server.HealthResponse:
      properties:
        active_kids:
          additionalProperties:
            type: string
          example:
            ES256: def456...
            RS256: abc123...
          type: object
        algorithms:
          example:
          - RS256
          - ES256
          - EdDSA
          items:
            type: string
          type: array
          uniqueItems: false
        status:
          example: ok
          type: string
        version:
          example: 1.0.0
          type: string
        warning:
          example: 'test issuer: keys are ephemeral and in-memory; do not use in production'
          type: string
      type: object
    internal_server.IndexResponse:
      properties:
        endpoints:
          example:
          - GET /healthz
          - GET /version
          - GET /.well-known/jwks.json
          items:
            type: string
          type: array
          uniqueItems: false
        service:
          example: jwtoken-tester
          type: string
        version:
          example: 1.0.0
          type: string
        warning:
          example: integration-test token issuer; ephemeral in-memory keys
          type: string
      type: object
    internal_server.IntrospectionRequest:
      properties:
        token:
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6Ii4uLiJ9...
          type: string
        token_type_hint:
          example: access_token
          type: string
      type: object
    internal_server.IntrospectionResponse:
      properties:
        active:
          example: true
          type: boolean
        scope:
          example: read write
          type: string
        token_type:
          example: Bearer
          type: string
      type: object
    internal_server.JWK:
      properties:
        alg:
          type: string
        crv:
          type: string
        e:
          type: string
        kid:
          type: string
        kty:
          type: string
        "n":
          type: string
        use:
          type: string
        x:
          type: string
        "y":
          type: string
      type: object
    internal_server.JWKS:
      properties:
        keys:
          items:
            $ref: '#/components/schemas/internal_server.JWK'
          type: array
          uniqueItems: false
      type: object
    internal_server.OAuthErrorResponse:
      properties:
        error:
          example: invalid_request
          type: string
        error_description:
          example: grant_type is required
          type: string
      type: object
    internal_server.OAuthTokenRequest:
      properties:
        alg:
          example: ES256
          type: string
        client_id:
          example: test-client
          type: string
        client_secret:
          example: ignored
          type: string
        grant_type:
          example: client_credentials
          type: string
        scope:
          example: read write
          type: string
        ttl:
          example: 5m
          type: string
      type: object
    internal_server.OAuthTokenResponse:
      properties:
        access_token:
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6Ii4uLiJ9...
          type: string
        expires_in:
          example: 3600
          type: integer
        scope:
          example: read write
          type: string
        token_type:
          example: Bearer
          type: string
      type: object
    internal_server.TokenRequest:
      properties:
        alg:
          example: RS256
          type: string
        claims:
          additionalProperties:
            type: string
          example:
            aud: my-service
            sub: user-123
          type: object
        corrupt:
          type: string
        cty:
          example: application/json
          type: string
        duplicate_claim:
          example: sub
          type: string
        headers:
          additionalProperties:
            type: string
          example:
            x-test-harness: run-7
          type: object
        kid:
          example: key-123
          type: string
        typ:
          example: at+jwt
          type: string
      type: object
    internal_server.TokenResponse:
      properties:
        access_token:
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6Ii4uLiJ9...
          type: string
        expires_in:
          example: 3600
          type: integer
        token_type:
          example: Bearer
          type: string
      type: object
    internal_server.VerifyRequest:
      properties:
        alg:
          example:
          - RS256
          items:
            type: string
          type: array
          uniqueItems: false
        leeway:
          example: 30s
          type: string
        token:
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6Ii4uLiJ9...
          type: string
      type: object
    internal_server.VerifyResponse:
      properties:
        alg:
          type: string
        claims:
          additionalProperties:
            type: string
          type: object
        error:
          type: string
        header:
          additionalProperties:
            type: string
          type: object
        kid:
          type: string
        kid_status:
          type: string
        reason:
          type: string
        unverified_claims:
          additionalProperties:
            type: string
          type: object
        valid:
          type: boolean
      type: object
    internal_server.VersionResponse:
      properties:
        version:
          example: 1.0.0
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      description: Type "Bearer" followed by a space and JWT.
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  contact:
    email: larryf1@gmail.com
    name: jwtoken-tester
    url: https://github.com/larryf1/jwtoken-tester
  description: Legacy bespoke endpoint retained for compatibility. Discovery advertises
    /oauth/token instead; use this route only when the v2 claim profile is required.
    Mints a signed v2 token using X-Client-Id and the comma-separated Scope query
    parameter. Requested scopes are copied into the token's capabilities claim. The
    JWT also includes sub, aud, idtyp, allowedResources, version, client_id, and the
    standard iss, iat, nbf, exp, and jti claims.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: jwtoken-tester API
  version: 2.6.0
openapi: 3.1.0
paths:
  /:
    get:
      description: Returns basic service information and available endpoints
      operationId: getIndex
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.IndexResponse'
          description: Successful response
      summary: Service index
      tags:
      - Metadata
  /.well-known/jwks.json:
    get:
      description: Returns the live public key set including active keys and retired
        keys still within their grace period. Each key includes RFC 7638 thumbprint-derived
        kid, use=sig, and algorithm (RS256, ES256, or EdDSA).
      operationId: getJWKS
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.JWKS'
          description: JWKS document
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.ErrorResponse'
          description: Internal server error
      summary: JSON Web Key Set (JWKS)
      tags:
      - Keys
  /.well-known/jwks.json/{kid}:
    get:
      description: Fetches a single public key from the live key set by its thumbprint-derived
        kid. Returns the same shape as one entry of the JWKS set. Retired keys still
        inside their grace window are reachable.
      operationId: getJWKByKID
      parameters:
      - description: RFC 7638 thumbprint-derived Key ID
        in: path
        name: kid
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.JWK'
          description: JWK document
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.ErrorResponse'
          description: Missing kid parameter
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.ErrorResponse'
          description: Key not found
      summary: Get single JWK by Key ID
      tags:
      - Keys
  /.well-known/oauth-authorization-server:
    get:
      description: Serves the same metadata document as /.well-known/openid-configuration.
        Derived core fields (issuer, jwks_uri, token_endpoint, introspection_endpoint)
        cannot be overridden by DISCOVERY_EXTRA_JSON.
      operationId: getAuthorizationServerMetadata
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.DiscoveryResponse'
          description: Authorization server metadata
      summary: OAuth 2.0 Authorization Server Metadata (RFC 8414)
      tags:
      - Discovery
  /.well-known/openid-configuration:
    get:
      description: Shared metadata document advertising issuer, derived jwks_uri,
        token_endpoint, introspection_endpoint, grant_types_supported, token_endpoint_auth_methods_supported,
        scopes_supported when configured, and id_token_signing_alg_values_supported
        listing all enabled algorithms.
      operationId: getDiscovery
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.DiscoveryResponse'
          description: Discovery document
      summary: OpenID Connect Discovery Document
      tags:
      - Discovery
  /healthz:
    get:
      description: Liveness probe with active key IDs per algorithm
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.HealthResponse'
          description: Service is healthy
      summary: Health check
      tags:
      - Metadata
  /introspect:
    post:
      description: 'Verifies the supplied token against this server''s live keyring
        and configured issuer. The request body must be application/x-www-form-urlencoded;
        token_type_hint is accepted and ignored. Authentication is permissive and
        no client identifier is required. Active tokens echo every token claim plus
        authoritative active: true and token_type: Bearer. Expired, not-yet-valid,
        wrong-issuer, unknown-key, bad-signature, and malformed tokens return 200
        with exactly {"active": false} and no claim fields.'
      operationId: introspectToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_server.IntrospectionRequest'
              description: Introspection request
              summary: request
        description: Introspection request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.IntrospectionResponse'
          description: Introspection result; inspect active
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.OAuthErrorResponse'
          description: Invalid request (missing token, non-form body, oversized body)
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.OAuthErrorResponse'
          description: Method not allowed
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.ErrorResponse'
          description: Rate limit exceeded
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.OAuthErrorResponse'
          description: Verification failed unexpectedly
      summary: Introspect a token (RFC 7662)
      tags:
      - Introspection
  /oauth/token:
    post:
      description: 'RFC 6749 client-credentials token endpoint for generic OAuth clients.
        The request body must be application/x-www-form-urlencoded. Authentication
        is permissive: a client identifier is required, but client_secret is never
        validated. Claims: iss, sub and client_id from the client identifier, iat,
        nbf, exp, jti, a space-normalized scope when requested, and aud only when
        AUDIENCE is configured.'
      operationId: mintOAuthClientCredentialsToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_server.OAuthTokenRequest'
              description: OAuth token request
              summary: request
        description: OAuth token request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.OAuthTokenResponse'
          description: Token minted successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.OAuthErrorResponse'
          description: Invalid request, unsupported grant type, disabled algorithm,
            invalid TTL, or oversized body
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.OAuthErrorResponse'
          description: Method not allowed
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.ErrorResponse'
          description: Rate limit exceeded
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.OAuthErrorResponse'
          description: Internal token-minting failure
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.OAuthErrorResponse'
          description: No active signing key available
      summary: Mint a token with OAuth 2.0 client credentials
      tags:
      - Tokens
  /token:
    post:
      description: 'Mints a JWT with the requested claims and algorithm. Empty body
        mints an anonymous token with defaults. Claim handling: iss, iat, nbf are
        injected automatically; explicit values in claims win. exp, iat, nbf accept
        epoch seconds, durations, or RFC 3339 timestamps. Omitted exp means now +
        DEFAULT_TTL (default 1h). Lifetimes beyond MAX_TTL (default 24h) are refused
        with 400. Algorithms: RS256, RS384, RS512, PS256, PS384, PS512, ES256, ES384,
        ES512, EdDSA (must be enabled). Negative controls require ALLOW_NEGATIVE_TOKENS.'
      operationId: mintToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_server.TokenRequest'
              description: Token minting request (empty body uses defaults)
              summary: request
        description: Token minting request (empty body uses defaults)
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.TokenResponse'
          description: Token minted successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.ErrorResponse'
          description: Bad request (invalid JSON, unsupported algorithm, TTL too long)
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.ErrorResponse'
          description: Negative token control is disabled
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.ErrorResponse'
          description: Method not allowed
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.ErrorResponse'
          description: Rate limit exceeded
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.ErrorResponse'
          description: No active signing key available
      summary: Mint a JWT
      tags:
      - Tokens
  /v2/oauth/token:
    post:
      description: Legacy bespoke endpoint retained for compatibility. Discovery advertises
        /oauth/token instead; use this route only when the v2 claim profile is required.
        Mints a signed v2 token using X-Client-Id and the comma-separated Scope query
        parameter. Requested scopes are copied into the token's capabilities claim.
        The JWT also includes sub, aud, idtyp, allowedResources, version, client_id,
        and the standard iss, iat, nbf, exp, and jti claims.
      operationId: mintOAuthV2Token
      parameters:
      - description: Client identifier
        example: client-id
        in: header
        name: X-Client-Id
        required: true
        schema:
          type: string
      - description: Accepted for request compatibility but not validated by this
          test issuer
        in: header
        name: X-Client-Secret
        schema:
          type: string
      - description: Comma-separated capabilities to place in the token
        example: capability1,capability2
        in: query
        name: Scope
        required: true
        schema:
          type: string
      - description: Enabled signing algorithm; defaults to RS256 when enabled, else
          the first enabled algorithm
        example: ES256
        in: query
        name: alg
        schema:
          type: string
      - description: Non-negative Go duration capped by MAX_TTL
        example: 5m
        in: query
        name: ttl
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.TokenResponse'
          description: Token minted successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.ErrorResponse'
          description: Missing client ID or scope
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.ErrorResponse'
          description: Method not allowed
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.ErrorResponse'
          description: Rate limit exceeded
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.ErrorResponse'
          description: No active signing key available
      summary: Mint a legacy v2 OAuth-style JWT
      tags:
      - Tokens
  /verify:
    post:
      description: 'Self-check verification: the token is checked only against the
        running issuer''s live keyring. The endpoint accepts no caller-supplied key
        material or key locations and performs no outbound network request. Unknown
        request fields are rejected with 400. The issuer claim is always validated
        against this server''s configured issuer. Failure reasons are a closed, ordered
        set: malformed, alg, kid, signature, expired, not_yet_valid, issuer, audience.'
      operationId: verifyToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_server.VerifyRequest'
              description: Verification request
              summary: request
        description: Verification request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.VerifyResponse'
          description: Verification completed; inspect valid and reason
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.ErrorResponse'
          description: Invalid request (missing token, unknown field, bad alg or leeway,
            oversized body)
        "405":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.ErrorResponse'
          description: Method not allowed
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.ErrorResponse'
          description: Rate limit exceeded
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.ErrorResponse'
          description: Verification failed for a reason outside the closed reason
            set
      summary: Verify a token against this issuer's live keyring
      tags:
      - Verification
  /version:
    get:
      description: Returns the service version
      operationId: getVersion
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.VersionResponse'
          description: Version information
      summary: Version information
      tags:
      - Metadata
