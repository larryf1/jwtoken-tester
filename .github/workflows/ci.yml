name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require SHA-pinned actions
        run: |
          set -euo pipefail
          # A mutable tag ref can be repointed at a malicious commit, so every
          # action must be pinned to a full 40-char commit SHA. Dependabot
          # understands the "<sha> # vX.Y.Z" form and keeps these pins current.
          # The leading anchor keeps this check from matching its own source.
          refs=$(grep -rhoE '^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*[^[:space:]]+@[^[:space:]#]+' .github/workflows/ || true)
          bad=$(printf '%s\n' "$refs" | grep -vE '@[0-9a-f]{40}$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Unpinned GitHub Action reference(s): ${bad}"
            echo "Pin each to a full 40-char commit SHA, keeping the version in a trailing comment."
            exit 1
          fi
          echo "All action references are SHA-pinned."

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

      - name: Run make lint
        run: make lint

  build-test:
    name: build-test (${{ matrix.os }} / go ${{ matrix.go-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ['1.27', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  coverage:
    needs: [lint, build-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Run make coverage-check (threshold 90%)
        run: make coverage-check

  npm-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          npm-version: '10.9.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check package-lock.json is in sync with package.json
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts >/dev/null 2>&1
          if ! git diff --exit-code -- package-lock.json; then
            echo "::error::package-lock.json is out of sync with package.json. Run 'npm install --package-lock-only' with npm 10 and commit the lockfile."
            exit 1
          fi

      - name: Verify registry signatures and provenance
        run: npm audit signatures

      - name: Audit for known vulnerabilities
        run: npm audit --audit-level=high

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          npm-version: '10.9.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint commit messages
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check Signed-off-by trailer on all commits
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          for sha in $(git rev-list "$BASE".."$HEAD"); do
            author=$(git show -s --format='%an' "$sha")
            # Skip DCO check for known bots
            if [[ "$author" =~ \[bot\]$ ]] || [[ "$author" == "github-actions" ]]; then
              echo "Skipping DCO check for bot commit: $sha ($author)"
              continue
            fi
            if ! git show -s --format=%B "$sha" | grep -q '^Signed-off-by:'; then
              echo "ERROR: commit $sha is missing a 'Signed-off-by:' trailer"
              git show -s --format='%h %s' "$sha"
              exit 1
            fi
          done
          echo "All commits are signed off."