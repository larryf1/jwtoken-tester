name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Run make lint
        run: make lint

  build-test:
    name: build-test (${{ matrix.os }} / go ${{ matrix.go-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ['1.27', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  coverage:
    needs: [lint, build-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Run make coverage-check (threshold 90%)
        run: make coverage-check

  npm-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          npm-version: '10.9.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check package-lock.json is in sync with package.json
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts >/dev/null 2>&1
          if ! git diff --exit-code -- package-lock.json; then
            echo "::error::package-lock.json is out of sync with package.json. Run 'npm install --package-lock-only' with npm 10 and commit the lockfile."
            exit 1
          fi

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          npm-version: '10.9.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Lint commit messages
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Signed-off-by trailer on all commits
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          for sha in $(git rev-list "$BASE".."$HEAD"); do
            author=$(git show -s --format='%an' "$sha")
            # Skip DCO check for known bots
            if [[ "$author" =~ \[bot\]$ ]] || [[ "$author" == "github-actions" ]]; then
              echo "Skipping DCO check for bot commit: $sha ($author)"
              continue
            fi
            if ! git show -s --format=%B "$sha" | grep -q '^Signed-off-by:'; then
              echo "ERROR: commit $sha is missing a 'Signed-off-by:' trailer"
              git show -s --format='%h %s' "$sha"
              exit 1
            fi
          done
          echo "All commits are signed off."