name: Publish (dev build)

on:
  workflow_dispatch:

permissions:
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jwtoken-tester

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          DESCRIBE=$(git describe --tags --match 'v*' --abbrev=7 2>/dev/null) || true
          if [[ -n "$DESCRIBE" ]]; then
            VERSION="${DESCRIBE#v}"
            VERSION="${VERSION//-g/-}"
          else
            COUNT=$(git rev-list --count HEAD)
            VERSION="0.0.0-${COUNT}-g${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE="${{ env.REGISTRY }}/larryf1/${{ env.IMAGE_NAME }}"
          docker build \
            --build-arg VERSION=${{ steps.version.outputs.version }} \
            --build-arg REVISION=${{ github.sha }} \
            --build-arg CREATED=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            -f docker/Dockerfile \
            -t "$IMAGE:${{ steps.version.outputs.version }}" .
          docker push "$IMAGE:${{ steps.version.outputs.version }}"
          echo "Pushed $IMAGE:${{ steps.version.outputs.version }}"