name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run go-semantic-release in dry mode (no writes, publish skipped)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jwtoken-tester

jobs:
  version:
    runs-on: ubuntu-latest
    # semantic-release pushes the release commit and tag back to the repo.
    permissions:
      contents: write
    outputs:
      release: ${{ steps.capture.outputs.release }}
      version: ${{ steps.capture.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run go-semantic-release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          args="--allow-no-changes --changelog CHANGELOG.md --prepend-changelog --version-file"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args="$args --dry"
          fi
          go run github.com/go-semantic-release/semantic-release/v2/cmd/semantic-release@v2.31.0 $args

      - name: Commit release artifacts, tag, and push
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          if [ ! -f .version ]; then
            echo "No new version; nothing to commit or tag."
            exit 0
          fi
          VERSION=$(cat .version)
          echo "$VERSION" > VERSION
          sed -i "s/version: \".*\"/version: \"$VERSION\"/" docs/openapi.yaml
          awk '/^# /{c++} c==1 && !/^# \[0/{print} c==2{exit}' CHANGELOG.md > /tmp/notes.md
          git add CHANGELOG.md VERSION docs/openapi.yaml
          git commit -m "chore(release): $VERSION [skip ci]" -m "$(cat /tmp/notes.md)"
          git tag -a "v$VERSION" -m "$(cat /tmp/notes.md)"
          git push origin main "v$VERSION"

      - name: Verify CHANGELOG.md updated
        if: inputs.dry_run != true
        run: |
          if [ -f CHANGELOG.md ]; then
            echo "CHANGELOG.md updated:"
            head -3 CHANGELOG.md
          else
            echo "CHANGELOG.md not found"
            exit 1
          fi

      - name: Capture release version
        id: capture
        run: |
          if [ -f .version ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$(cat .version)" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "No new version from go-semantic-release; skipping publish."
          fi

  publish:
    needs: version
    if: needs.version.outputs.release == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    # GoReleaser creates the GitHub release; the image is pushed to GHCR.
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: v${{ needs.version.outputs.version }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE="${{ env.REGISTRY }}/larryf1/${{ env.IMAGE_NAME }}"
          docker build \
            --build-arg VERSION=${{ needs.version.outputs.version }} \
            --build-arg REVISION=${{ github.sha }} \
            --build-arg CREATED=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            -f docker/Dockerfile \
            -t "$IMAGE:${{ needs.version.outputs.version }}" .
          docker push "$IMAGE:${{ needs.version.outputs.version }}"
          docker tag "$IMAGE:${{ needs.version.outputs.version }}" "$IMAGE:latest"
          docker push "$IMAGE:latest"
          echo "Pushed $IMAGE:${{ needs.version.outputs.version }} and $IMAGE:latest"