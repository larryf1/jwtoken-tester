name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview the Semrel release (no writes or publication)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jwtoken-tester

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: true

      - name: Require a clean main checkout
        run: |
          test "$(git rev-parse --abbrev-ref HEAD)" = "main"
          test -z "$(git status --porcelain)"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Restore pinned Semrel plugins
        run: go run github.com/SemRels/semrel/cmd/semrel@v0.28.3 plugin restore

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false
          git config tag.gpgSign false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true

      - name: Run Semrel
        id: semrel
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SEMREL_PLUGIN_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SEMREL_ANALYTICS_FILE: /dev/null
        run: |
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            go run github.com/SemRels/semrel/cmd/semrel@v0.28.3 release --dry-run
          else
            go run github.com/SemRels/semrel/cmd/semrel@v0.28.3 release
          fi
