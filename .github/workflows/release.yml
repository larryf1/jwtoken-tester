name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run go-semantic-release in dry mode (no writes, publish skipped)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jwtoken-tester

jobs:
  version:
    runs-on: ubuntu-latest
    # semantic-release pushes the release commit and tag back to the repo.
    permissions:
      contents: write
    outputs:
      release: ${{ steps.capture.outputs.release }}
      version: ${{ steps.capture.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run go-semantic-release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            go run github.com/go-semantic-release/semantic-release/v2/cmd/semantic-release@v2.31.0 \
              --allow-no-changes \
              --changelog CHANGELOG.md \
              --prepend-changelog \
              --dry
          else
            go run github.com/go-semantic-release/semantic-release/v2/cmd/semantic-release@v2.31.0 \
              --allow-no-changes \
              --changelog CHANGELOG.md \
              --prepend-changelog
          fi

      - name: Verify CHANGELOG.md updated
        if: inputs.dry_run != true
        run: |
          if [ -f CHANGELOG.md ]; then
            echo "CHANGELOG.md updated:"
            head -3 CHANGELOG.md
          else
            echo "CHANGELOG.md not found"
            exit 1
          fi

      - name: Capture release version
        id: capture
        run: |
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "Dry run - skipping publish."
            exit 0
          fi
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            TAG=$(git describe --tags --exact-match HEAD)
            VERSION=${TAG#v}
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Tag $TAG is not a semantic version (X.Y.Z). Skipping publish." >&2
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "version=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "No new version tag on HEAD from go-semantic-release; skipping publish."
          fi

  publish:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    # GoReleaser creates the GitHub release; the image is pushed to GHCR.
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: v${{ needs.version.outputs.version }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ format('yyyy-MM-ddTHH:mm:ssZ', github.event.repository.updated_at) }}
          tags: |
            ${{ env.REGISTRY }}/larryf1/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.version }}
            ${{ env.REGISTRY }}/larryf1/${{ env.IMAGE_NAME }}:latest